<!doctype html>
<html lang="en">
  <!-- HEADER AREA -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Budget Tracker</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <!-- BODY AREA -->
  <body>
    <header>
      <div class="logo">💼 Budget Tracker</div>

      <div class="action-group">
        <button class="btn-action btn-vps" onclick="openVPSModal()">
          VPS Data
        </button>
        <button class="btn-action btn-add" onclick="openModal()">Add +</button>
      </div>
    </header>

    <main>
      <table>
        <thead>
          <tr>
            <th>No</th>
            <th>Date</th>
            <th>Title</th>
            <th>Amount</th>
            <th>Type</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>

      <!-- BODY: Summary -->
      <div class="summary">
        <div class="card income">
          <p>Total Income</p>
          <h3 id="total-income">0</h3>
        </div>
        <div class="card expense">
          <p>Total Expense</p>
          <h3 id="total-expense">0</h3>
        </div>
        <div class="card balance">
          <p>Balance</p>
          <h3 id="balance">0</h3>
        </div>
      </div>
    </main>

    <!-- MODAL : Add Transaction -->
    <div id="modal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h3 id="modal-title">Add Transaction</h3>
          <span onclick="closeModal()">×</span>
        </div>

        <input type="hidden" id="tx-id" />

        <label>Title</label>
        <input type="text" id="title" placeholder="Enter title" />

        <label>Amount</label>
        <input type="number" id="amount" placeholder="Enter amount" />

        <label for="type">Type</label>
        <select id="type" title="Select transaction type">
          <option value="income">Income</option>
          <option value="expense">Expense</option>
          <!-- <option value="saving">Saving</option> -->
        </select>

        <div class="modal-actions">
          <button id="saveBtn" type="button" class="btn-save">Save</button>
          <button id="cancelBtn" type="button" class="btn-cancel">
            Cancel
          </button>
        </div>
      </div>
    </div>

    <!-- MODAL : VPS Data -->
    <div id="vps-modal" class="modal">
      <div class="modal-content">
        <h2>VPS Monitoring</h2>

        <div class="vps-grid">
          <p>Status:</p>
          <p id="vps-status">-</p>

          <p>CPU:</p>
          <p id="vps-cpu">-</p>

          <p>Memory Used:</p>
          <p id="vps-memory-used">-</p>

          <p>Total Memory:</p>
          <p id="vps-memory-total">-</p>

          <p>Goroutines:</p>
          <p id="vps-goroutines">-</p>
        </div>

        <div class="modal-actions">
          <button id="refresh-vps" onclick="loadVPSData()">Refresh</button>

          <button id="close-vps-modal" onclick="closeVPSModal()">Close</button>
        </div>
      </div>
    </div>

    <!-- BODY: Footer -->
    <footer class="footer">
      <p>© 2026 Sanbercode DevOps Bootcamp</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
